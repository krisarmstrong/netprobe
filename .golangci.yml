version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true
  relative-path-mode: gomod

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/krisarmstrong/netprobe
    golines:
      max-len: 120

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - depguard
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gomoddirectives
    - gosec
    - govet
    - iface
    - ineffassign
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unqueryvet
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - interfacebloat
  settings:
    cyclop:
      max-complexity: 20
      package-average: 10.0
    goconst:
      min-occurrences: 10
      min-len: 3
    depguard:
      rules:
        deprecated:
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead.
            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead; satori's package is not maintained.
            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 or later.
        non-test-files:
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead.
        non-main-files:
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead.
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - map
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 20
    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink
    govet:
      enable-all: true
      disable:
        - fieldalignment
    mnd:
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir
        - os.MkdirAll
        - os.OpenFile
        - os.WriteFile
        - pflag.
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
